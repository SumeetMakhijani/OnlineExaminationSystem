<!DOCTYPE html>
<html lang="en">
<head>
    <title>Employee Login</title>
    <style>
        body{
            background: url('image.jpeg');
            background-repeat: no-repeat;
			background-attachment: fixed;
  			background-size: cover;
            
        }
        .outter{
            border: 1px solid black;
            width: 450px;
            height: 600px;
            background:#b3f0ff;
            margin-left: 500px;
            margin-top: 100px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .form1{
            padding-left: 70px;
            color: white;
            float: left;
            padding-top: 60px;
            font-weight: 650;
            font-size: 32px;
        }
        .form1 input{
            height:40px;
            width: 300px;
            background: white;
            border-radius: 7px;
        }
        .form1 ::placeholder{
            color: #8c8c8c;
            padding-left: 10px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }
        #seinput{
            margin-top: 13px;
        }
        .signin{
            margin-top: 300px;
            text-align: center;
        }
        .signin button{
            width: 300px;
            height: 40px;
            border: 1px solid red;
            padding-right: 125px;
            padding-left: 125px;
            padding-top: 15px;
            padding-bottom: 15px;
            background: red;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .head{
            color:#8c8c8c;
            font-weight: 500;
            margin-left:78px ;
            margin-top: 60px;
            float: left;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }
        .head a{
            color: white;
            text-decoration: none;
        }
       
    </style>
</head>
<body>
    <form action="admin_login_operation.jsp" method="post">
        <div class="outter">
            <div class="form1">
                Admin Signup
                <br>
                <br>
                <input type="text" placeholder="Username " name="username" id="username">
                <br>
                <input type="password" placeholder="password" id="seinput" name="password" id="password">   
            </div>
            <div class="signin">
               <button type="submit">Sign In</button>
             
            </div>
        </div>
    </form>

</body>
</html>
