<!DOCTYPE html>
<html lang="en">
<head>
    <title>Employee Login</title>
    <style>
        body{
         	background: url('image.jpeg');
            background-repeat: no-repeat;
			background-attachment: fixed;
  			background-size: cover;
        }
        .outter{
            border: 1px solid black;
            width: 450px;
            height: 600px;
            background:#b3f0ff;
            margin-left: 500px;
            margin-top: 100px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .form1{
            padding-left: 70px;
            color: white;
            float: left;
            padding-top: 60px;
            font-weight: 650;
            font-size: 32px;
        }
        .form1 input{
            height:40px;
            width: 300px;
            background: white;
            border-radius: 7px;
        }
        .form1 ::placeholder{
            color: #8c8c8c;
            padding-left: 10px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }
        #seinput{
            margin-top: 13px;
        }
        .signin{
            margin-top: 300px;
            text-align: center;
        }
        .signin #button{
            width: 300px;
            height: 40px;
            border: 1px solid red;
            padding-right: 125px;
            padding-left: 125px;
            padding-top: 15px;
            padding-bottom: 15px;
            background: red;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
        }
        .head{
            color:#8c8c8c;
            font-weight: 500;
            margin-left:78px ;
            margin-top: 60px;
            float: left;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }
        .head a{
            color: white;
            text-decoration: none;
        }
       
    </style>
    <script>
		function check(){
			if(document.forms.form12.value==""){
				alert("Name is empty");
				document.form12.name.focus();
                return false;
			}
			if(document.form12.email.value==""){
				alert("Email is empty");
				document.form12.email.focus();
				return false;
			}
			if(document.form12.password.value==""){
				alert("password is empty");
				document.form12.password.focus();
				return false;
			}
			
		}
	</script>
</head>
<body>
    <form action="login_save.jsp" name="form12" id="form12" onsubmit="return check()">
        <div class="outter">
            <div class="form1">
                Employee Signup
                <br>
                <br>	
                 <input type="text" placeholder="Enter Your Name" name="name"> 
                <br>
                <input type="email" placeholder="Email or phone number" name="email">
                <br>
                <input type="password" placeholder="password" id="seinput" name="password"> 
                <br>
                <br>
            </div>
            <div class="signin">
                <input type="submit" id="button" >
            </div>
        </div>
    </form>

</body>
</html>
